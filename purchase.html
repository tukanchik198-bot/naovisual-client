<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaoVisuals</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/header.js"></script>
    <style>
@import url('https://v1.fontapi.ir/css/SFProDisplay');

* {
    margin: 0; padding: 0;
    text-decoration: none;
    box-sizing: border-box;
    list-style: none;
    scroll-behavior: smooth;
    font-family: SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif;
}

:root {
    --text-color: rgba(255,255,255,0.9);
    --text-other-color: rgba(255,255,255,0.7);
    --text-desc: rgb(185,185,185,0.9);
    --text-desc-on: rgb(185,185,185,0.9);
    --border: rgb(255,255,255,0.06);
}

body {
    background: #000;
    background-image: url("img/fon.svg");
    background-repeat: no-repeat;
    background-position: center top;
    background-size: cover;
    min-height: 100vh;
}

::-webkit-scrollbar { width: 4px; background: #000; }
::-webkit-scrollbar-thumb { background: rgb(73,73,73); border-radius: 20px; }
::-webkit-scrollbar-button { display: none; }
img { -webkit-user-drag: none; }

/* ===== HEADER ===== */
header {
    position: fixed; top: 0; left: 0;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 14px 12%;
    display: flex;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    z-index: 100;
}
header .open-ul { display: none; }
header .logo-text {
    display: flex; align-items: center; gap: 12px;
    text-decoration: none; color: inherit;
    transition: color .2s ease, transform .2s ease;
}
header .logo-text img { width: 26px; height: 26px; object-fit: contain; display: block; }
header .logo { color: var(--text-color); font-size: 20px; font-weight: 500; }
header ul { display: flex; align-items: center; }
header li { margin: 0 16px; }
header li a { color: var(--text-color); font-weight: 400; font-size: 16px; }

header .button {
    position: relative; padding: 12px 26px;
    border-radius: 40px; background: rgba(20,20,20,0.63);
    border: none; overflow: hidden;
    color: var(--text-color); font-size: 16px;
    cursor: pointer; transition: 0.15s ease-in-out;
}
header .button::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 40px; padding: 1px;
    background: linear-gradient(149deg,#fff -10%,#fff -60%,rgba(255,255,255,0.06) 20%,rgba(255,255,255,0.06) 80%,#fff 130%,#fff 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
header .button:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0,0,0,0.28); }

.profile-button {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 40px;
    background: rgba(20,20,20,0.63);
    cursor: pointer; transition: 0.15s ease-in-out;
    position: relative; overflow: hidden;
}
.profile-button::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 40px; padding: 1px;
    background: linear-gradient(149deg,#fff -10%,#fff -60%,rgba(255,255,255,0.06) 20%,rgba(255,255,255,0.06) 80%,#fff 130%,#fff 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
.profile-button:hover { transform: scale(1.02); box-shadow: 0 6px 16px rgba(0,0,0,0.28); }
.profile-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.profile-name { color: var(--text-color); font-size: 16px; font-weight: 400; }

.skeleton {
    position: relative; overflow: hidden;
    background: rgba(255,255,255,0.05); border-radius: 1000px;
}
.skeleton::after {
    position: absolute; top:0; right:0; bottom:0; left:0;
    transform: translateX(-100%);
    background-image: linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,0.05) 20%,rgba(255,255,255,0.1) 60%,rgba(255,255,255,0));
    animation: shimmer 2s infinite; content: '';
}
@keyframes shimmer { 100% { transform: translateX(100%); } }

/* ===== MAIN ===== */
main { padding: 0 12%; padding-bottom: 0; overflow-x: hidden; }

.main-sect {
    display: flex; align-items: center;
    justify-content: center; height: 100vh;
}

.container {
    display: flex; flex-direction: row;
    gap: 20px; justify-content: center;
    align-items: stretch; flex-wrap: wrap;
}

.product, .buy, .popup, .wrapper, .custom-select-wrapper {
    align-items: center; position: relative;
    padding: 20px; border-radius: 35px;
    background: transparent; border: none;
    backdrop-filter: blur(37.5px); overflow: hidden;
    box-shadow: 4px 7px 13.5px rgb(0,0,0,0.15);
}
.product::before, .buy::before, .popup::before, .wrapper::before, .custom-select-wrapper::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 35px; padding: 1px;
    background: linear-gradient(149deg,#fff -30%,#fff -60%,rgba(255,255,255,0.06) 20%,rgba(255,255,255,0.06) 80%,#fff 130%,#fff 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
.product img { width: 240px; border-radius: 20px; }
.buy {
    width: 100%; padding: 13px 10px;
    font-size: 16px; color: var(--text-color);
    background: rgb(20,20,20,0.55); cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.buy:hover { transform: scale(1.03); }
.text { margin: 12px 0; }
.text p { font-size: 17px; color: var(--text-other-color); font-weight: 400; }
.text h2 { font-size: 22px; color: var(--text-color); font-weight: 500; margin-bottom: 4px; }

/* ===== POPUP ===== */
.popup-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,20,0.55);
    backdrop-filter: blur(10px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    animation: overlay-fade-in 0.3s cubic-bezier(.4,0,.2,1);
}
.popup {
    overflow: visible; width: 540px; max-width: 95vw;
    position: relative; display: flex;
    flex-direction: column; align-items: stretch;
    border-radius: 32px; padding: 28px;
    backdrop-filter: blur(25px);
    animation: popup-fade-in 0.38s cubic-bezier(0.45,1.45,0.49,1.15);
}
.other { display: flex; gap: 20px; margin-bottom: 20px; }
.popup-close {
    position: absolute; top: 18px; right: 22px;
    background: none; border: none;
    font-size: 22px; color: #fff; cursor: pointer;
    line-height: 1;
}
.popup-img { width: 80px; height: 80px; object-fit: contain; flex-shrink: 0; }
.popup-info { flex: 1 1 0; display: flex; flex-direction: column; align-items: stretch; }
.other .text .popup-title { color: #fff; font-size: 24px; margin-bottom: 6px; font-weight: 500; }
.other .text .popup-price { color: var(--text-other-color); font-size: 18px; }
.promo-input {
    border: none; width: 100%; padding: 18px 22px;
    color: var(--text-color); font-weight: 400;
    background: transparent; font-size: 16px; outline: none;
}
.wrapper { padding: 0; margin-bottom: 14px; }
.popup-buy {
    align-items: center; position: relative; padding: 20px;
    border-radius: 35px; background: transparent; border: none;
    overflow: hidden; width: 100%; color: var(--text-color);
    font-size: 18px; background-color: rgb(20,20,20,0.35);
    cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.popup-buy::before {
    content: ""; position: absolute; inset: 0;
    border-radius: 35px; padding: 1px;
    background: linear-gradient(149deg,#fff -30%,#fff -60%,rgba(255,255,255,0.06) 20%,rgba(255,255,255,0.06) 80%,#fff 130%,#fff 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
}
.popup-buy:hover { transform: scale(1.03); background-color: rgb(20,20,20,0.45); }

/* ===== FOOTER ===== */
.footer {
    padding: 40px 0; margin-top: 100px;
    width: 100vw; border-top: 1px solid var(--border);
    margin-left: calc(-50vw + 50%);
    position: relative; overflow: hidden;
    background: rgb(20,20,20,0.50); backdrop-filter: blur(10px);
}
.footer-content {
    width: 100%; margin: 0 auto;
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr 1fr 1.5fr;
    gap: 60px; padding: 20px 250px;
}
.footer-section h3 { color: var(--text-color); font-size: 18px; margin: 0 0 20px 0; font-weight: 500; }
.footer-section p { color: var(--text-desc-on); font-size: 14px; margin: 8px 0; }
.footer-section ul { list-style: none; padding: 0; margin: 0; }
.footer-section ul li { margin: 12px 0; }
.footer-section ul li a { color: var(--text-desc-on); font-size: 16px; text-decoration: none; font-weight: 400; transition: 0.15s ease-in-out; }
.footer-section ul li a:hover { color: var(--text-color); }

/* ===== ANIMATIONS ===== */
@keyframes popup-fade-in { from{opacity:0;transform:translateY(40px) scale(0.97)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes overlay-fade-in { from{opacity:0} to{opacity:1} }
@keyframes product-fade-in { from{opacity:0;transform:translateY(30px) scale(0.98)} to{opacity:1;transform:translateY(0) scale(1)} }
.product { opacity:0; animation: product-fade-in 0.6s cubic-bezier(0.45,1.45,0.49,1.15) forwards; }
.product:nth-child(1){animation-delay:0.1s}
.product:nth-child(2){animation-delay:0.2s}
.product:nth-child(3){animation-delay:0.3s}
.product:nth-child(4){animation-delay:0.4s}
.product:nth-child(5){animation-delay:0.5s}
@keyframes popup-fade-out { from{opacity:1;transform:translateY(0) scale(1)} to{opacity:0;transform:translateY(40px) scale(0.97)} }
@keyframes overlay-fade-out { from{opacity:1} to{opacity:0} }
.popup-overlay.closing { animation: overlay-fade-out 0.3s forwards; }
.popup-overlay.closing .popup { animation: popup-fade-out 0.38s cubic-bezier(0.45,1.45,0.49,1.15) forwards; }

/* ===== RESPONSIVE ===== */
@media (max-width:1400px){ .footer-content{padding:20px 150px} }
@media (max-width:1180px){ .footer-content{padding:20px 100px} }
@media (max-width:990px){ header{padding:14px 6%} main{padding:0 6%} }
@media (max-width:760px){ .footer-content{padding:20px 50px;display:flex;flex-direction:column;gap:20px} }
@media (max-width:620px){
    header ul{display:none}
    header.menu-open{border-bottom:none;background:rgba(0,0,0,0.7)}
    header .open-ul{display:block;background-color:transparent;border:none;outline:none;cursor:pointer}
    .open-ul i{font-size:26px;color:var(--text-color)}
    header .button{margin-right:8px}
    header ul.mobile-open{
        position:absolute;top:100%;left:0;width:100vw;min-width:100vw;z-index:200;
        display:flex!important;flex-direction:column;align-items:flex-start;
        background:rgba(0,0,0,0.7);backdrop-filter:blur(16px);
        border-bottom:1px solid var(--border);padding:18px 0;gap:0;
        box-shadow:0 8px 32px 0 rgba(0,0,0,0.14);
    }
    header ul.mobile-open li{margin:12px;padding:0 3%;width:100%;text-align:left}
    header ul.mobile-open li a{font-size:20px}
    .header-actions{display:flex;align-items:center;gap:8px}
}
@media (max-width:520px){ .footer-content{padding:20px 20px} }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-text">
                <img src="img/logo.svg" alt="" fetchpriority="high">NaoVisuals
            </a>
        </div>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="purchase.html">Покупка</a></li>
            <li><a href="faq.html">FAQ</a></li>
        </ul>
        <div class="header-actions">
            <button onclick="location.href='signup.html'" class="button">Регистрация</button>
            <button class="open-ul"><i class="ph-bold ph-list"></i></button>
        </div>
    </header>

    <main>
        <section class="main-sect">
            <div class="container" id="products-container"></div>
        </section>

        <div class="popup-overlay" id="popup-overlay" style="display:none;">
            <div class="popup">
                <button class="popup-close" id="popup-close">✕</button>
                <div class="popup-content">
                    <div class="other">
                        <img src="" alt="Товар" class="popup-img" id="popup-img">
                        <div class="text">
                            <h2 class="popup-title" id="popup-title"></h2>
                            <p class="popup-price" id="popup-price"></p>
                        </div>
                    </div>
                    <div class="popup-info">
                        <div class="wrapper">
                            <input type="text" class="promo-input" id="promo-input" placeholder="Промокод (необязательно)">
                        </div>
                        <button class="popup-buy" id="popup-buy-btn">Оплатить</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>NaoVisuals</h3>
                    <p>© 2025 NaoVisuals.<br>Все права защищены</p>
                </div>
                <div class="footer-section">
                    <h3>Платформа</h3>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="purchase.html">Покупка</a></li>
                        <li><a href="faq.html">FAQ</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Аккаунт</h3>
                    <ul>
                        <li><a href="signin.html">Вход</a></li>
                        <li><a href="signup.html">Регистрация</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Контакты</h3>
                    <ul>
                        <li><a href="https://t.me/darkvibe">Телеграм</a></li>
                        <li><a href="https://t.me/darkvibe">Дискорд</a></li>
                        <li><a href="https://t.me/darkvibe">ВКонтакте</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Соглашения</h3>
                    <ul>
                        <li><a href="license.html">Лицензионное соглашение</a></li>
                    </ul>
                </div>
            </div>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function checkAuth() { return !!localStorage.getItem('nao_session'); }
            function redirectToSignin() { window.location.href = 'signin.html'; }

            function getProductImage(name) {
                if (!name) return 'img/default-product.webp';
                const n = name.toLowerCase();
                if (n.includes('hwid') || n.includes('хвид') || n.includes('сброс')) return 'img/products/hwid.png';
                if (n.includes('beta') || n.includes('бета')) return 'img/default-product.webp';
                if (n.includes('30') || n.includes('месяц')) return 'img/products/30.png';
                if (n.includes('180') || n.includes('полгода')) return 'img/products/180.png';
                if (n.includes('365') || n.includes('год')) return 'img/products/365.png';
                return 'img/default-product.webp';
            }

            async function loadProducts() {
                try {
                    let products = [];
                    try {
                        const response = await fetch('/api/v1/internal/customization/products/getAll');
                        if (response.ok) {
                            const data = await response.json();
                            products = data.products || [];
                        }
                    } catch (e) {}

                    if (products.length === 0) {
                        products = [{ id: 'beta', name: 'Beta', price: 1500, duration: 100000, version: 'Beta' }];
                    }

                    const container = document.getElementById('products-container');
                    if (!container) return;
                    container.innerHTML = '';

                    products.forEach(product => {
                        const productDiv = document.createElement('div');
                        productDiv.className = 'product';
                        productDiv.setAttribute('data-product-id', product.id);

                        const img = document.createElement('img');
                        img.src = getProductImage(product.name);
                        img.alt = product.name || 'Товар';
                        img.onerror = function () { this.onerror = null; this.src = 'img/default-product.webp'; };

                        const textDiv = document.createElement('div');
                        textDiv.className = 'text';

                        const h2 = document.createElement('h2');
                        h2.textContent = product.name || 'Товар';

                        const p = document.createElement('p');
                        p.textContent = `Цена: ${product.price}₽`;
                        if (product.duration && product.duration > 0) p.textContent += ` (${product.duration} дней)`;
                        if (product.version) p.textContent += ` | Версия: ${product.version}`;

                        textDiv.appendChild(h2);
                        textDiv.appendChild(p);

                        const buyBtn = document.createElement('button');
                        buyBtn.className = 'buy';
                        buyBtn.textContent = 'Приобрести';

                        productDiv.appendChild(img);
                        productDiv.appendChild(textDiv);
                        productDiv.appendChild(buyBtn);
                        container.appendChild(productDiv);
                    });

                    attachBuyHandlers();
                } catch (error) {
                    console.error('Ошибка при загрузке товаров:', error);
                }
            }

            function attachBuyHandlers() {
                document.querySelectorAll('.buy').forEach((btn) => {
                    btn.addEventListener('click', function() {
                        if (!checkAuth()) { redirectToSignin(); return; }
                        const card = btn.closest('.product');
                        if (!card) return;
                        const productId = card.getAttribute('data-product-id');
                        const img = card.querySelector('img');
                        const title = card.querySelector('h2');
                        const price = card.querySelector('p');
                        const popupImg = document.getElementById('popup-img');
                        const popupTitle = document.getElementById('popup-title');
                        const popupPrice = document.getElementById('popup-price');
                        if (popupImg && img) popupImg.src = img.src;
                        if (popupTitle && title) popupTitle.textContent = title.textContent;
                        if (popupPrice && price) popupPrice.textContent = price.textContent;
                        const popupBuyBtn = document.getElementById('popup-buy-btn');
                        if (popupBuyBtn) popupBuyBtn.setAttribute('data-product-id', productId);
                        popupOverlay.style.display = 'flex';
                    });
                });
            }

            const popupOverlay = document.getElementById('popup-overlay');
            loadProducts();

            function closePopup() {
                popupOverlay.classList.add('closing');
                setTimeout(() => { popupOverlay.style.display = 'none'; popupOverlay.classList.remove('closing'); }, 380);
            }

            const popupClose = document.getElementById('popup-close');
            if (popupClose) popupClose.onclick = closePopup;
            popupOverlay.addEventListener('mousedown', function(e) { if (e.target === this) closePopup(); });
            document.addEventListener('keydown', function(e) { if (e.key === "Escape" && popupOverlay.style.display === 'flex') closePopup(); });

            const popupBuyBtn = document.getElementById('popup-buy-btn');
            if (popupBuyBtn) {
                popupBuyBtn.addEventListener('click', async function() {
                    if (!checkAuth()) { redirectToSignin(); return; }
                    const productId = popupBuyBtn.getAttribute('data-product-id');
                    if (!productId) { alert('Ошибка: не выбран товар'); return; }
                    const promoInput = document.getElementById('promo-input');
                    const promocode = promoInput ? promoInput.value.trim() : '';
                    popupBuyBtn.disabled = true;
                    popupBuyBtn.textContent = 'Обработка...';
                    try {
                        const token = localStorage.getItem('jwtToken');
                        const params = new URLSearchParams({ productId: productId, method: 'TINKOFF' });
                        if (promocode) params.append('promocode', promocode);
                        const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                        if (token) headers['Authorization'] = `Bearer ${token}`;
                        const response = await fetch(`/api/v1/products/payment?${params.toString()}`, {
                            method: 'POST', headers: headers, credentials: 'include'
                        });
                        let data;
                        const contentType = response.headers.get('content-type');
                        if (contentType && contentType.includes('application/json')) {
                            data = await response.json();
                        } else {
                            const text = await response.text();
                            try { data = JSON.parse(text); } catch(e) { throw new Error(text || 'Ошибка при создании платежа'); }
                        }
                        if (!response.ok) throw new Error(data.error || data.message || 'Ошибка при создании платежа');
                        if (data.response) {
                            if (typeof data.response === 'string' && data.response.startsWith('http')) { window.location.href = data.response; return; }
                            else if (typeof data.response === 'object' && data.response.link) { window.location.href = data.response.link; return; }
                            else { alert('Ответ сервера: ' + data.response); }
                        } else if (data.error) {
                            alert('Ошибка: ' + data.error);
                        } else {
                            alert('Неожиданный формат ответа: ' + JSON.stringify(data));
                        }
                        popupBuyBtn.disabled = false;
                        popupBuyBtn.textContent = 'Оплатить';
                    } catch (error) {
                        console.error('Ошибка при создании платежа:', error);
                        alert('Ошибка: ' + error.message);
                        popupBuyBtn.disabled = false;
                        popupBuyBtn.textContent = 'Оплатить';
                    }
                });
            }
        });
    </script>
</body>
</html>
